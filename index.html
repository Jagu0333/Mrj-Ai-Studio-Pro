<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MrJ AI Studio Pro</title>
  <!-- Environment Shim for Vercel/Browser compatibility -->
  <script>
    window.process = window.process || { env: {} };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ios: {
              blue: '#007aff',
              darkBlue: '#0a84ff',
              gray: '#8e8e93',
              lightBg: '#fbfbfd',
              darkBg: '#000000',
              secondaryLight: '#f2f2f7',
              secondaryDark: '#1c1c1e'
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg-main: #fbfbfd;
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(0, 0, 0, 0.08);
      --ios-blue: #007aff;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
    }

    .dark {
      --bg-main: #000000;
      --glass-bg: rgba(28, 28, 30, 0.75);
      --glass-border: rgba(255, 255, 255, 0.1);
      --ios-blue: #0a84ff;
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.1) transparent;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Plus Jakarta Sans", sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      margin: 0;
      overflow: hidden;
      position: relative;
      letter-spacing: -0.01em;
    }

    .glass-effect {
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
    }

    @keyframes ios-fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-ios-in {
      animation: ios-fade-in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    textarea:focus, input:focus {
      outline: none;
      border-color: var(--ios-blue) !important;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(120, 120, 120, 0.2);
      border-radius: 10px;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
